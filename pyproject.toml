[project]
name = "asic-rag"
version = "0.1.0"
description = "RAG system for ASIC design debugging"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml",
    "chromadb>=0.5,<1",
    "openai>=1.0,<2",
    "anthropic>=0.40,<1",
    "python-dotenv",
    "posthog<4",
]

[project.scripts]
corpus  = "asic_rag.corpus:main"
ingest  = "asic_rag.ingest:main"
query   = "asic_rag.query:main"
eval    = "asic_rag.eval:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asic_rag"]
